name = "edge-clickstream"
main = "src/index.js"
compatibility_date = "2025-06-01"

# Tầng lưu trữ: Cloudflare D1 (SQLite serverless)
[[d1_databases]]
binding = "DB"
database_name = "clickstream"
database_id = "e6361d1e-dab6-49bc-925a-648d60817fcc"

# Tầng hàng đợi: Cloudflare Queues (đệm giữa edge và database)
[[queues.producers]]
binding = "EVENTS_QUEUE"
queue = "click-events"

[[queues.consumers]]
queue = "click-events"
max_batch_size = 20
max_batch_timeout = 1      # giây – giữ độ trễ thấp cho demo

# Tầng "batch" để so sánh: cron chạy mỗi 2 phút
[triggers]
crons = ["*/2 * * * *"]

# RESET_KEY (khóa cho /reset và /batch) là secret, không ghi ở đây:
#   deploy thật: npx wrangler secret put RESET_KEY
#   chạy local:  ghi RESET_KEY=... vào file .dev.vars (đã gitignore)
